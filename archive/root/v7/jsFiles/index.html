<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor v7 - jsFiles Editor (Upload JS File & Babel Hover Errors)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../style.css">

  <style>
    .font-control-group {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 8px;
      overflow: hidden;
      font-family: monospace;
      font-size: 12px;
    }
    .font-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .font-btn:hover {
      color: #ffffff;
      background: rgba(51, 65, 85, 0.6);
    }
    .font-size-display {
      padding: 0 8px;
      color: #e2e8f0;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <!-- Header -->
    <header>

      <div class="brand-group">
        <div class="logo">JS</div>

        <div class="title-area">
          <h1 id="file-title">end-points.js</h1>
          <p>Local Standalone Editor</p>
        </div>
      </div>

      <div class="actions">

        <!-- Font Size Controls (A- 14px A+) -->
        <div class="font-control-group">
          <button id="font-decrease" class="font-btn" title="Decrease Font Size">A-</button>
          <span id="font-size-val" class="font-size-display">14px</span>
          <button id="font-increase" class="font-btn" title="Increase Font Size">A+</button>
        </div>

        <!-- Settings Button -->
        <a href="settings.html" class="btn" style="text-decoration: none;">
          Settings
        </a>

        <!-- How to Use Button -->
        <a href="howToUse.html" class="btn" style="text-decoration: none;">
          How to Use
        </a>

        <!-- Hidden File Input for Upload JS File -->
        <input type="file" id="file-upload-input" accept=".js,.ts,.javascript,.jsx,.tsx" style="display: none;">

        <button id="upload-button" class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Upload JS File
        </button>

        <button id="copy-button" class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy Code
        </button>

        <button id="download-button" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download File
        </button>
      </div>

    </header>

    <!-- Workspace -->
    <main class="workspace">
      <div id="editor-container"></div>
    </main>

    <!-- Status Bar -->
    <footer class="statusbar">
      <div class="statusbar-item">
        <span id="line-count">Lines: 0</span>
      </div>
      <div class="statusbar-item">
        <span>UTF-8</span>
        <span>JavaScript</span>
        <span>Monaco Editor CDN</span>
      </div>
    </footer>

  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Monaco Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>

  <!-- Application Script -->
  <script type="module" src="./app.js"></script>

</body>
</html>
