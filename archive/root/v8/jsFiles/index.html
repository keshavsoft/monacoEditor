<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor v8 - Ultimate JS Suite</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../style.css">

  <style>
    body { font-family: 'Outfit', 'Inter', sans-serif; background-color: #07090e; color: #f8fafc; }
    code { font-family: 'Fira Code', monospace; }

    /* Modern Sleek Header */
    .sleek-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
    }

    /* Icon Action Buttons */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .icon-btn:hover {
      background: #21262d;
      border-color: #8b949e;
      color: #ffffff;
    }

    .icon-btn-purple { border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }
    .icon-btn-purple:hover { background: rgba(147, 51, 234, 0.2); border-color: #a855f7; }

    .icon-btn-teal { border-color: rgba(6, 182, 212, 0.4); color: #38bdf8; }
    .icon-btn-teal:hover { background: rgba(6, 182, 212, 0.2); border-color: #06b6d4; }

    /* Font Size Control Group */
    .font-control-group {
      display: inline-flex;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      font-size: 11px;
    }
    .font-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 5px 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .font-btn:hover { color: #ffffff; background: #21262d; }
    .font-size-display { padding: 0 6px; color: #58a6ff; font-weight: 600; font-family: monospace; }

    /* VS Code Style File Tabs Bar */
    .tabs-bar {
      display: flex;
      align-items: center;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 0 12px;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 12px;
      color: #8b949e;
      background: #0d1117;
      border-right: 1px solid #21262d;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-item.active {
      color: #38bdf8;
      background: #07090e;
      border-top: 2px solid #38bdf8;
      font-weight: 600;
    }

    /* AST Side Drawer */
    .ast-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: #0d1117;
      border-left: 1px solid #30363d;
      z-index: 999;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }
    .ast-drawer.open { right: 0; }

    /* Error Console Drawer */
    .console-drawer {
      height: 180px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      display: none;
      flex-direction: column;
    }
    .console-drawer.open { display: flex; }

    /* Main Workspace Split Layout */
    .workspace {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #editor-container {
      width: 100%;
      height: 100%;
      flex: 1;
    }
    .preview-container {
      width: 0;
      height: 100%;
      display: none;
      background: #0d1117;
      border-left: 1px solid #30363d;
    }
    .workspace.split-mode #editor-container {
      width: 50% !important;
      flex: none !important;
    }
    .workspace.split-mode .preview-container {
      display: flex !important;
      flex-direction: column !important;
      width: 50% !important;
      flex: none !important;
    }
  </style>
</head>

<body>

  <div class="app-container" style="height: 100vh; display: flex; flex-direction: column;">

    <!-- SLEEK ORGANIZED HEADER TOOLBAR -->
    <header class="sleek-header">

      <!-- LEFT: BRAND & FILE TITLE -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #0284c7, #06b6d4); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: #ffffff;">
          JS
        </div>
        <div>
          <h1 id="file-title" style="font-size: 14px; font-weight: 700; color: #f0f6fc; margin: 0;">end-points.js</h1>
          <p style="font-size: 10px; color: #8b949e; margin: 0;">Monaco v8 Editor Suite</p>
        </div>
      </div>

      <!-- CENTER: TOOLTOGGLE GROUP -->
      <div style="display: flex; align-items: center; gap: 8px;">

        <!-- Presets Selector -->
        <select id="preset-selector" class="icon-btn icon-btn-teal" style="outline: none;">
          <option value="">⚡ Presets</option>
          <option value="errors">Sample with 4 Babel Errors</option>
          <option value="clean">Sample Clean Express Router</option>
          <option value="async">Sample Async Middleware</option>
        </select>

        <!-- AST Inspector Drawer Button -->
        <button id="toggle-ast-btn" class="icon-btn icon-btn-purple">
          🌳 AST Inspector
        </button>

        <!-- Live Preview Button -->
        <button id="toggle-preview-btn" class="icon-btn icon-btn-teal">
          👁 Live Preview
        </button>
      </div>

      <!-- RIGHT: UTILITIES & ACTIONS -->
      <div style="display: flex; align-items: center; gap: 8px;">

        <!-- Font Size Controls -->
        <div class="font-control-group">
          <button id="font-decrease" class="font-btn" title="Decrease Font Size">A-</button>
          <span id="font-size-val" class="font-size-display">14px</span>
          <button id="font-increase" class="font-btn" title="Increase Font Size">A+</button>
        </div>

        <a href="settings.html" class="icon-btn" title="Editor Settings">⚙ Settings</a>
        <a href="howToUse.html" class="icon-btn" title="User Guide">📖 Help</a>

        <input type="file" id="file-upload-input" accept=".js,.ts,.javascript,.jsx,.tsx" style="display: none;">

        <button id="upload-button" class="icon-btn">
          <span>↑</span> Upload
        </button>

        <button id="copy-button" class="icon-btn">📋 Copy</button>

        <button id="download-button" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px; font-weight: 600;">
          📥 Download
        </button>
      </div>

    </header>

    <!-- SECONDARY TOOLBAR: FILE TABS -->
    <div class="tabs-bar" id="tabs-container">
      <div class="tab-item active" data-file="end-points.js">
        <span>📄 end-points.js</span>
      </div>
      <div class="tab-item" data-file="app-clean.js">
        <span>📄 app-clean.js</span>
      </div>
      <button id="add-tab-btn" style="background: transparent; border: none; color: #8b949e; font-size: 14px; padding: 0 8px; cursor: pointer;">+</button>
    </div>

    <!-- MAIN WORKSPACE CONTAINER -->
    <main class="workspace" style="flex: 1; display: flex; position: relative; overflow: hidden;">
      
      <!-- Monaco Editor Container -->
      <div id="editor-container" style="flex: 1; height: 100%;"></div>

      <!-- Live Split Preview Iframe -->
      <div id="preview-container" class="preview-container">
        <iframe id="preview-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>

    </main>

    <!-- ERROR CONSOLE BOTTOM DRAWER -->
    <div id="console-drawer" class="console-drawer">
      <div style="padding: 6px 16px; background: #161b22; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; font-weight: 700; color: #f87171;">❌ Babel AST Error Console</span>
        <button id="close-console" style="background: transparent; border: none; color: #8b949e; cursor: pointer;">&times;</button>
      </div>
      <div id="console-log-list" style="flex: 1; padding: 8px 16px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #fca5a5;">
        <em>No AST errors detected.</em>
      </div>
    </div>

    <!-- STATUS BAR -->
    <footer class="statusbar">
      <div class="statusbar-item">
        <span id="line-count">Lines: 0</span>
      </div>
      <div class="statusbar-item">
        <button id="toggle-console-btn" style="background: transparent; border: none; color: #f87171; font-weight: 700; cursor: pointer; margin-right: 15px;">
          ❌ Errors: <span id="error-count">0</span>
        </button>
        <span>UTF-8</span>
        <span>JavaScript</span>
        <span>Monaco v8 Master Suite</span>
      </div>
    </footer>

  </div>

  <!-- AST SLIDING SIDE DRAWER -->
  <div id="ast-drawer" class="ast-drawer">
    <div style="padding: 12px 16px; background: #161b22; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-size: 13px; font-weight: 700; color: #c084fc;">🌳 Babel AST Inspector</h3>
      <button id="close-ast-drawer" style="background: transparent; border: none; color: #8b949e; font-size: 18px; cursor: pointer;">&times;</button>
    </div>
    <div style="flex: 1; padding: 12px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #e2e8f0;">
      <pre id="ast-json-output">Parsing AST...</pre>
    </div>
  </div>

  <!-- Monaco Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>

  <!-- Application Script -->
  <script type="module" src="./app.js"></script>

</body>
</html>
