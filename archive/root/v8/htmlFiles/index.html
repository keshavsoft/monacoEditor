<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor v8 - Ultimate HTML Suite</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../style.css">

  <style>
    body { font-family: 'Outfit', 'Inter', sans-serif; background-color: #07090e; color: #f8fafc; }
    code { font-family: 'Fira Code', monospace; }

    .sleek-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .icon-btn:hover {
      background: #21262d;
      border-color: #8b949e;
      color: #ffffff;
    }

    .icon-btn-purple { border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }
    .icon-btn-purple:hover { background: rgba(147, 51, 234, 0.2); border-color: #a855f7; }

    .font-control-group {
      display: inline-flex;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      font-size: 11px;
    }
    .font-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 5px 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .font-btn:hover { color: #ffffff; background: #21262d; }
    .font-size-display { padding: 0 6px; color: #a855f7; font-weight: 600; font-family: monospace; }

    .tabs-bar {
      display: flex;
      align-items: center;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 0 12px;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 12px;
      color: #8b949e;
      background: #0d1117;
      border-right: 1px solid #21262d;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-item.active {
      color: #a855f7;
      background: #07090e;
      border-top: 2px solid #a855f7;
      font-weight: 600;
    }

    .preview-container {
      width: 50%;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid #30363d;
      display: none;
    }
    .preview-container.open { display: block; }
  </style>
</head>

<body>

  <div class="app-container" style="height: 100vh; display: flex; flex-direction: column;">

    <!-- SLEEK ORGANIZED HEADER TOOLBAR -->
    <header class="sleek-header">

      <!-- LEFT: BRAND & FILE TITLE -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #9333ea); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: #ffffff;">
          HTML
        </div>
        <div>
          <h1 id="file-title" style="font-size: 14px; font-weight: 700; color: #f0f6fc; margin: 0;">index.html</h1>
          <p style="font-size: 10px; color: #8b949e; margin: 0;">Monaco v8 Editor Suite</p>
        </div>
      </div>

      <!-- CENTER: TOOLTOGGLE GROUP -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="toggle-preview-btn" class="icon-btn icon-btn-purple">
          👁 Live Render Preview
        </button>
      </div>

      <!-- RIGHT: UTILITIES & ACTIONS -->
      <div style="display: flex; align-items: center; gap: 8px;">

        <div class="font-control-group">
          <button id="font-decrease" class="font-btn" title="Decrease Font Size">A-</button>
          <span id="font-size-val" class="font-size-display">14px</span>
          <button id="font-increase" class="font-btn" title="Increase Font Size">A+</button>
        </div>

        <a href="settings.html" class="icon-btn" title="Editor Settings">⚙ Settings</a>
        <a href="howToUse.html" class="icon-btn" title="User Guide">📖 Help</a>

        <input type="file" id="file-upload-input" accept=".html,.htm" style="display: none;">

        <button id="upload-button" class="icon-btn">
          <span>↑</span> Upload
        </button>

        <button id="copy-button" class="icon-btn">📋 Copy</button>

        <button id="download-button" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px; font-weight: 600;">
          📥 Download
        </button>
      </div>

    </header>

    <!-- SECONDARY TOOLBAR: FILE TABS -->
    <div class="tabs-bar" id="tabs-container">
      <div class="tab-item active" data-file="index.html">
        <span>📄 index.html</span>
      </div>
      <div class="tab-item" data-file="template.html">
        <span>📄 template.html</span>
      </div>
    </div>

    <!-- MAIN WORKSPACE CONTAINER -->
    <main class="workspace" style="flex: 1; display: flex; position: relative; overflow: hidden;">
      
      <!-- Monaco Editor Container -->
      <div id="editor-container" style="flex: 1; height: 100%;"></div>

      <!-- Live Render Preview Iframe -->
      <div id="preview-container" class="preview-container">
        <iframe id="preview-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>

    </main>

    <!-- STATUS BAR -->
    <footer class="statusbar">
      <div class="statusbar-item">
        <span id="line-count">Lines: 0</span>
      </div>
      <div class="statusbar-item">
        <span id="html-stats" class="font-mono text-purple-300 font-semibold" style="margin-right: 15px;">IDs: 0 Classes: 0 Tags: 0</span>
        <span>UTF-8</span>
        <span>HTML</span>
        <span>Monaco v8 Master Suite</span>
      </div>
    </footer>

  </div>

  <!-- Monaco Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>

  <!-- Application Script -->
  <script type="module" src="./app.js"></script>

</body>
</html>
