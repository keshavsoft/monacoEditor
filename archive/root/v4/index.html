<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor - end-points.js</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-group">
        <div class="logo">JS</div>
        <div class="title-area">
          <h1>end-points.js</h1>
          <p>Local Standalone Editor</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="copyCode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Code
        </button>
        <button class="btn btn-primary" onclick="downloadCode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download File
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <div id="editor-container"></div>
    </div>

    <!-- Statusbar -->
    <div class="statusbar">
      <div class="statusbar-item">
        <span id="line-count">Lines: 19</span>
      </div>
      <div class="statusbar-item">
        <span>UTF-8</span>
        <span>JavaScript</span>
        <span>Monaco Editor CDN</span>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Load Monaco Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script src="js/core/editor-data.js"></script>
  <script src="js/core/editor-theme.js"></script>
  <script src="js/core/editor-setup.js"></script>
  <script src="js/features/toast.js"></script>
  <script src="js/features/clipboard.js"></script>
  <script src="js/features/download.js"></script>
  
  <!-- External Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>
