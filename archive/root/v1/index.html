<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monaco Editor - end-points.js</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #111827;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #8b5cf6; /* Violet */
      --primary-glow: rgba(139, 92, 246, 0.15);
      --secondary: #06b6d4; /* Cyan */
      --accent-green: #10b981;
      --font-outfit: 'Outfit', sans-serif;
      --font-inter: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-inter);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* App Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* Header */
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-outfit);
      font-weight: 800;
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .title-area h1 {
      font-family: var(--font-outfit);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.1rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
    }

    /* Premium buttons */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-family: var(--font-outfit);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      border: none;
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.5);
      background: linear-gradient(135deg, #9061f9 0%, #8b5cf6 100%);
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      background-color: var(--panel-bg);
    }

    #editor-container {
      width: 100%;
      height: 100%;
    }

    /* Footer / Statusbar */
    .statusbar {
      background: #0b0c10;
      border-top: 1px solid var(--card-border);
      height: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .statusbar-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* Toast Notification system */
    .toast-container {
      position: fixed;
      bottom: 2.5rem;
      right: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 1000;
    }

    .toast {
      background: rgba(17, 24, 30, 0.95);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 280px;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast-success {
      border-left: 4px solid var(--accent-green);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-group">
        <div class="logo">JS</div>
        <div class="title-area">
          <h1>end-points.js</h1>
          <p>Local Standalone Editor</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="copyCode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy Code
        </button>
        <button class="btn btn-primary" onclick="downloadCode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download File
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <div id="editor-container"></div>
    </div>

    <!-- Statusbar -->
    <div class="statusbar">
      <div class="statusbar-item">
        <span id="line-count">Lines: 19</span>
      </div>
      <div class="statusbar-item">
        <span>UTF-8</span>
        <span>JavaScript</span>
        <span>Monaco Editor CDN</span>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Load Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <script>
    // Hardcoded endpoints.js code
    const fileCode = `import express from 'express';

import funcFromshowAll from './showAll/controller.js';
import funcFrominsertWithMeta from './insertWithMeta/controller.js';
import funcFromdel from './del/controller.js';
import funcFrommodify from './modify/controller.js';

const tableName = "doctors.json";
const tablePath = "Data/doctors.json";
const configPath = "Config/Schemas/doctors.json";

const router = express.Router();

router.get('/showAll', (req, res) => funcFromshowAll({ req, res, inTablePath: tablePath }));
router.post('/insertWithMeta', express.json(), (req, res) => funcFrominsertWithMeta({ req, res, inTablePath: tablePath, inConfigPath: configPath }));
router.delete('/del/:pk', (req, res) => funcFromdel({ req, res, inTablePath: tablePath }));
router.put('/modify', express.json(), (req, res) => funcFrommodify({ req, res, inTablePath: tablePath, inConfigPath: configPath }));

export { router };`;

    let editor;

    // Load Monaco
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function () {
      // Define a custom theme
      monaco.editor.defineTheme('custom-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'comment', foreground: '6b7280', fontStyle: 'italic' },
          { token: 'keyword', foreground: 'c084fc', fontStyle: 'bold' },
          { token: 'string', foreground: 'a5f3fc' },
          { token: 'number', foreground: 'f472b6' }
        ],
        colors: {
          'editor.background': '#111827',
          'editor.foreground': '#f3f4f6',
          'editor.lineHighlightBackground': '#1f2937',
          'editorLineNumber.foreground': '#4b5563',
          'editorLineNumber.activeForeground': '#c084fc',
          'editorCursor.foreground': '#c084fc'
        }
      });

      // Initialize Editor
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: fileCode,
        language: 'javascript',
        theme: 'custom-dark',
        automaticLayout: true,
        fontFamily: "'Courier New', Courier, monospace",
        fontSize: 14,
        lineHeight: 22,
        tabSize: 2,
        wordWrap: 'on',
        minimap: { enabled: true }
      });

      // Update lines count
      editor.onDidChangeModelContent(() => {
        const lineCount = editor.getModel().getLineCount();
        document.getElementById('line-count').textContent = `Lines: ${lineCount}`;
      });
    });

    // Copy Code Action
    function copyCode() {
      if (!editor) return;
      const text = editor.getValue();
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Code copied to clipboard!'))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.top = '0';
      textArea.style.left = '0';
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast('Code copied to clipboard!');
        } else {
          showToast('Failed to copy code.', 'error');
        }
      } catch (err) {
        showToast('Failed to copy code.', 'error');
      }
      document.body.removeChild(textArea);
    }

    // Download Code Action
    function downloadCode() {
      if (!editor) return;
      const element = document.createElement('a');
      const file = new Blob([editor.getValue()], {type: 'text/javascript'});
      element.href = URL.createObjectURL(file);
      element.download = "end-points.js";
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      showToast('Downloading end-points.js...');
    }

    // Notification toast helper
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icon = type === 'success'
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;

      toast.innerHTML = `
        ${icon}
        <span>${escapeHTML(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
