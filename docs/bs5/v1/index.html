<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Editor — Table Workbench</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="tab-bar">
        <div class="editor-tabs" id="editorTabs">
            <button class="tab-item active" id="tabColumns" type="button" title="View & Edit Columns JSON">
                <i class="bi bi-columns text-info"></i>
                <span>columns.json</span>
            </button>
            <button class="tab-item" id="tabData" type="button" title="View & Edit Data JSON">
                <i class="bi bi-database text-warning"></i>
                <span>data.json</span>
            </button>
        </div>

        <div class="tab-actions">
            <button class="action-btn" id="columnsModalBtn" type="button" data-bs-toggle="modal"
                data-bs-target="#columnsModal" title="Select or Upload Columns JSON">
                <i class="bi bi-columns"></i>
                <span>Columns</span>
            </button>
            <button class="action-btn" id="dataModalBtn" type="button" data-bs-toggle="modal"
                data-bs-target="#dataModal" title="Select or Upload Data JSON">
                <i class="bi bi-database"></i>
                <span>Data</span>
            </button>
        </div>
    </div>

    <div class="split-view">
        <div class="editor-pane">
            <div id="jsonEditor"></div>
        </div>
        <div class="preview-pane">
            <div class="preview-header">
                <span>DOM Preview</span>
                <button id="renderBtn" class="render-btn" type="button">
                    <i class="bi bi-play-fill"></i>
                    <span>Render</span>
                </button>
            </div>
            <div id="domPreview" class="dom-preview"></div>
        </div>
    </div>

    <!-- Columns Modal -->
    <div class="modal fade" id="columnsModal" tabindex="-1" aria-labelledby="columnsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title h6 fw-bold mb-0" id="columnsModalLabel">
                        <i class="bi bi-columns text-info me-2"></i>Columns JSON
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="mb-3">
                        <button type="button" id="loadSampleColumnsBtn" class="btn btn-outline-primary w-100">
                            <i class="bi bi-lightning-charge me-1"></i>Load Sample Columns
                        </button>
                    </div>
                    <div class="text-center text-muted small my-2">— or upload file —</div>
                    <div>
                        <label for="colFileInput" class="form-label small fw-semibold text-secondary">Upload JSON File</label>
                        <input type="file" id="colFileInput" class="form-control form-control-sm"
                            accept=".json,application/json,text/json">
                    </div>
                </div>
                <div class="modal-footer bg-white py-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Modal -->
    <div class="modal fade" id="dataModal" tabindex="-1" aria-labelledby="dataModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title h6 fw-bold mb-0" id="dataModalLabel">
                        <i class="bi bi-database text-warning me-2"></i>Data JSON
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    <div class="mb-3">
                        <button type="button" id="loadSampleDataBtn" class="btn btn-outline-warning text-dark w-100">
                            <i class="bi bi-lightning-charge me-1"></i>Load Sample Data
                        </button>
                    </div>
                    <div class="text-center text-muted small my-2">— or upload file —</div>
                    <div>
                        <label for="dataFileInput" class="form-label small fw-semibold text-secondary">Upload JSON File</label>
                        <input type="file" id="dataFileInput" class="form-control form-control-sm"
                            accept=".json,application/json,text/json">
                    </div>
                </div>
                <div class="modal-footer bg-white py-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
