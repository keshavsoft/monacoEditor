<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Editor & Visual Renderer • @keshavsoft/json-to-tag</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
      --bg-page: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --panel-header-bg: #f8fafc;
      --brand-primary: #0284c7;
      --brand-primary-hover: #0369a1;
    }

    body {
      background-color: var(--bg-page);
      font-family: var(--font-sans);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar Styling */
    .top-navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 1020;
    }

    /* Controls Bar */
    .controls-bar {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    /* Workspace Split Grid */
    .workspace-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .split-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      flex: 1;
      min-height: 600px;
    }

    @media (max-width: 991px) {
      .split-grid {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    /* Panels */
    .workspace-panel {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      height: calc(100vh - 215px);
      min-height: 540px;
    }

    @media (max-width: 991px) {
      .workspace-panel {
        height: 520px;
      }
    }

    .panel-header {
      background: var(--panel-header-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    /* Monaco Editor Container */
    .editor-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      min-height: 0;
      height: 100%;
    }

    #monacoContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    #fallbackEditor {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      color: #0f172a;
      background: #ffffff;
      display: none;
      outline: none;
    }

    /* Output Render Preview */
    .preview-wrapper {
      flex: 1;
      overflow: auto;
      padding: 20px;
      background: #fbfcfe;
      position: relative;
    }

    #outputContainer {
      min-height: 100%;
    }

    /* Drag and Drop Overlay */
    .drag-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 132, 199, 0.08);
      border: 2px dashed #0284c7;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      font-weight: 600;
      color: #0284c7;
    }

    .workspace-panel.dragover .drag-overlay {
      display: flex;
    }

    /* Empty state styling */
    .empty-render-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 320px;
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
    }

    .empty-render-icon {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    /* Subtle pulse animation for live sync */
    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .sync-indicator.synced {
      background-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .sync-indicator.error {
      background-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .sync-indicator.syncing {
      background-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }
  </style>

  <!-- Monaco Editor AMD Loader from jsDelivr -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>

<body>



  <!-- Main Container -->
  <main class="container-fluid px-3 py-3 workspace-container">

    <!-- Controls Toolbar -->
    <div class="controls-bar p-2 mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <!-- Left Controls: File Upload & Presets -->
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <label for="jsonFileInput" class="form-label mb-0 fw-semibold small text-secondary d-flex align-items-center">
          <i class="bi bi-file-earmark-code text-primary me-1"></i>Select JSON:
        </label>
        <input type="file" id="jsonFileInput" class="form-control form-control-sm" accept=".json,application/json"
          style="max-width: 250px;" />
      </div>

      <!-- Right Controls: Status & Editor Actions -->
      <div class="d-flex align-items-center gap-2 flex-wrap ms-auto">
        <div class="form-check form-switch mb-0 d-flex align-items-center gap-1"
          title="Automatically re-render DOM as you type in editor">
          <input class="form-check-input" type="checkbox" id="autoRenderToggle" checked style="cursor: pointer;">
          <label class="form-check-label small fw-semibold text-secondary" for="autoRenderToggle"
            style="cursor: pointer;">Live Sync</label>
        </div>

        <button class="btn btn-primary btn-sm" type="button" id="btnManualRender"
          title="Re-render output from editor JSON">
          <i class="bi bi-play-fill me-1"></i> Render
        </button>
      </div>
    </div>

    <!-- Side-by-Side Split Workspace -->
    <div class="split-grid">

      <!-- LEFT SIDE: Monaco Editor Panel -->
      <section class="workspace-panel" id="editorPanel">
        <div class="panel-header">
          <div class="panel-title text-primary">
            <i class="bi bi-code-slash"></i>
            <span>JSON Specification</span>
            <span class="badge bg-light text-muted border fw-normal text-lowercase" id="editorLineCountBadge">0
              lines</span>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btnFormatJson"
              title="Prettify / Format JSON (Alt+Shift+F)">
              <i class="bi bi-magic me-1"></i> Format
            </button>
            <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btnCopyJson" title="Copy JSON to clipboard">
              <i class="bi bi-clipboard me-1"></i> Copy
            </button>
            <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btnToggleTheme"
              title="Toggle Editor Theme (Light / Dark)">
              <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm py-0 px-2" id="btnClearEditor" title="Clear Editor">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <div class="editor-wrapper">
          <div class="drag-overlay">
            <i class="bi bi-cloud-arrow-up fs-2 me-2"></i> Drop JSON file here to load
          </div>
          <div id="monacoContainer"></div>
          <textarea id="fallbackEditor" spellcheck="false"
            placeholder="Upload or paste JSON specification here..."></textarea>
        </div>
      </section>

      <!-- RIGHT SIDE: Rendered DOM Output Panel -->
      <section class="workspace-panel" id="previewPanel">
        <div class="panel-header">
          <div class="panel-title text-success">
            <i class="bi bi-display"></i>
            <span>Rendered Output</span>
            <span class="badge bg-light text-secondary border fw-normal" id="nodesCountBadge">0 DOM Nodes</span>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btnViewHtml"
              title="View generated HTML markup">
              <i class="bi bi-code-square me-1"></i> HTML
            </button>
            <button class="btn btn-outline-secondary btn-sm py-0 px-2" id="btnClearOutput" title="Clear rendered view">
              <i class="bi bi-eraser me-1"></i> Reset
            </button>
          </div>
        </div>

        <div class="preview-wrapper">
          <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none mb-3" role="alert">
            <div class="d-flex align-items-start gap-2">
              <i class="bi bi-exclamation-triangle-fill fs-5 mt-n1"></i>
              <div class="flex-grow-1">
                <strong>Render Error:</strong>
                <span id="errorMessage" class="d-block font-monospace small mt-1"></span>
              </div>
              <button type="button" class="btn-close" id="btnCloseErrorAlert" aria-label="Close"></button>
            </div>
          </div>

          <div id="outputContainer">
            <div class="empty-render-state" id="emptyPlaceholder">
              <i class="bi bi-cloud-arrow-up empty-render-icon"></i>
              <h5 class="fw-semibold text-secondary">No Output to Display</h5>
              <p class="small text-muted mb-0">Select or upload a JSON file to render the output here.</p>
            </div>
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- HTML Inspector Modal -->
  <div class="modal fade" id="htmlModal" tabindex="-1" aria-labelledby="htmlModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h1 class="modal-title fs-6 fw-bold" id="htmlModalLabel">
            <i class="bi bi-code-square text-primary me-1"></i> Generated HTML Markup
          </h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-0">
          <pre class="m-0 p-3 bg-dark text-light font-monospace small" style="max-height: 480px; overflow: auto;"
            id="htmlModalCode"></pre>
        </div>
        <div class="modal-footer py-1">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCopyHtml">
            <i class="bi bi-clipboard me-1"></i> Copy HTML
          </button>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application Logic (ES Module) -->
  <script type="module">
    // Load json-to-tag buildSpecElement (v9 with SVG and mixed text support)
    let buildSpecElement;
    try {
      const localMod = await import("../dist/min.js");
      buildSpecElement = localMod.buildSpecElement || localMod.default;
    } catch (e) {
      try {
        const cdnMod = await import("https://keshavsoft.github.io/json-to-tag/dist/min.js");
        buildSpecElement = cdnMod.buildSpecElement || cdnMod.default;
      } catch (err2) {
        try {
          const v9Mod = await import("../dist/v9/min.js");
          buildSpecElement = v9Mod.buildSpecElement || v9Mod.default;
        } catch (err3) {
          console.error("Failed to load buildSpecElement:", err3);
        }
      }
    }

    if (!buildSpecElement && window.ks?.jsonToTag?.buildSpecElement) {
      buildSpecElement = window.ks.jsonToTag.buildSpecElement;
    }

    // UI Element References
    const fileInput = document.getElementById("jsonFileInput");
    const btnSampleTable = document.getElementById("btnSampleTable");
    const btnSampleSpec = document.getElementById("btnSampleSpec");
    const btnLoadSession = document.getElementById("btnLoadSession");
    const btnManualRender = document.getElementById("btnManualRender");
    const autoRenderToggle = document.getElementById("autoRenderToggle");
    const activeFileNameBadge = document.getElementById("activeFileNameBadge");
    const syntaxStatusBadge = document.getElementById("syntaxStatusBadge");
    const syntaxStatusText = document.getElementById("syntaxStatusText");
    const syncDot = document.getElementById("syncDot");
    const editorLineCountBadge = document.getElementById("editorLineCountBadge");
    const nodesCountBadge = document.getElementById("nodesCountBadge");
    const outputContainer = document.getElementById("outputContainer");
    const errorAlert = document.getElementById("errorAlert");
    const errorMessage = document.getElementById("errorMessage");
    const btnCloseErrorAlert = document.getElementById("btnCloseErrorAlert");
    const btnFormatJson = document.getElementById("btnFormatJson");
    const btnCopyJson = document.getElementById("btnCopyJson");
    const btnToggleTheme = document.getElementById("btnToggleTheme");
    const themeIcon = document.getElementById("themeIcon");
    const btnClearEditor = document.getElementById("btnClearEditor");
    const btnClearOutput = document.getElementById("btnClearOutput");
    const btnViewHtml = document.getElementById("btnViewHtml");
    const htmlModalCode = document.getElementById("htmlModalCode");
    const btnCopyHtml = document.getElementById("btnCopyHtml");
    const monacoContainer = document.getElementById("monacoContainer");
    const fallbackEditor = document.getElementById("fallbackEditor");
    const editorPanel = document.getElementById("editorPanel");

    // Sample 1: The exact table specification from the user's screenshot
    const SAMPLE_TABLE_SPEC = {
      tagName: "div",
      classList: "card shadow-sm border rounded overflow-hidden",
      children: [
        {
          tagName: "table",
          classList: "table table-hover mb-0",
          children: [
            {
              tagName: "thead",
              classList: "table-dark",
              children: [
                {
                  tagName: "tr",
                  children: [
                    { tagName: "th", classList: "py-3 px-4", textContent: "itemName" },
                    { tagName: "th", classList: "py-3 px-4", textContent: "baseUnit" }
                  ]
                }
              ]
            },
            {
              tagName: "tbody",
              children: [
                {
                  tagName: "tr",
                  children: [
                    { tagName: "td", classList: "py-2 px-4", textContent: "0.09/30mm" },
                    { tagName: "td", classList: "py-2 px-4", textContent: "kgs" }
                  ]
                },
                {
                  tagName: "tr",
                  children: [
                    { tagName: "td", classList: "py-2 px-4", textContent: "0.11-25" },
                    { tagName: "td", classList: "py-2 px-4", textContent: "kgs" }
                  ]
                },
                {
                  tagName: "tr",
                  children: [
                    { tagName: "td", classList: "py-2 px-4", textContent: "0.11-30" },
                    { tagName: "td", classList: "py-2 px-4", textContent: "kgs" }
                  ]
                },
                {
                  tagName: "tr",
                  children: [
                    { tagName: "td", classList: "py-2 px-4", textContent: "0.12/40mm" },
                    { tagName: "td", classList: "py-2 px-4", textContent: "kgs" }
                  ]
                },
                {
                  tagName: "tr",
                  children: [
                    { tagName: "td", classList: "py-2 px-4", textContent: "1.00/50mm" },
                    { tagName: "td", classList: "py-2 px-4", textContent: "mtr" }
                  ]
                }
              ]
            }
          ]
        }
      ]
    };

    // Sample 2: Interactive card component spec from show.html
    const SAMPLE_CARD_SPEC = {
      tagName: "div",
      classList: "card p-4 shadow-sm bg-white border",
      children: [
        {
          tagName: "div",
          classList: "d-flex justify-content-between align-items-center mb-3",
          children: [
            { tagName: "h4", classList: "text-primary fw-bold mb-0", textContent: "Sample Specification" },
            { tagName: "span", classList: "badge bg-success-subtle text-success border border-success-subtle", textContent: "Rendered Component" }
          ]
        },
        {
          tagName: "p",
          classList: "text-muted small mb-3",
          textContent: "This component was rendered directly from a JSON specification using buildSpecElement."
        },
        {
          tagName: "div",
          classList: "mb-3",
          children: [
            {
              tagName: "label",
              classList: "form-label small fw-semibold text-secondary",
              textContent: "Sample Input Field"
            },
            {
              tagName: "input",
              classList: "form-control form-control-sm",
              attributes: { type: "text", placeholder: "Type something...", value: "Pre-filled text" }
            }
          ]
        },
        {
          tagName: "div",
          classList: "d-flex gap-2",
          children: [
            {
              tagName: "button",
              classList: "btn btn-primary btn-sm px-3",
              textContent: "Submit Action",
              attributes: { type: "button" }
            },
            {
              tagName: "button",
              classList: "btn btn-outline-secondary btn-sm px-3",
              textContent: "Reset",
              attributes: { type: "button" }
            }
          ]
        }
      ]
    };

    let monacoEditorInstance = null;
    let isMonacoLoaded = false;
    let currentTheme = "vs"; // "vs" (light) or "vs-dark"
    let liveRenderDebounceTimer = null;
    let currentFileName = "spec.json";

    // Helper: Get code from editor (Monaco or fallback textarea)
    const getEditorValue = () => {
      if (isMonacoLoaded && monacoEditorInstance) {
        return monacoEditorInstance.getValue();
      }
      return fallbackEditor.value;
    };

    // Helper: Set code into editor
    const setEditorValue = (code) => {
      if (isMonacoLoaded && monacoEditorInstance) {
        monacoEditorInstance.setValue(code);
      } else {
        fallbackEditor.value = code;
      }
      updateLineCountBadge(code);
    };

    // Update lines count
    const updateLineCountBadge = (code) => {
      const lines = code ? code.split("\n").length : 0;
      editorLineCountBadge.textContent = `${lines} ${lines === 1 ? 'line' : 'lines'}`;
    };

    // Hide error alert
    const clearError = () => {
      errorAlert.classList.add("d-none");
      errorMessage.textContent = "";
    };

    // Show error alert
    const showError = (msg) => {
      errorMessage.textContent = msg;
      errorAlert.classList.remove("d-none");
    };

    // Render DOM using buildSpecElement
    const renderSpec = ({ inSpec, inFileName }) => {
      const localSpec = inSpec;
      const localFileName = inFileName ?? currentFileName ?? "spec.json";
      currentFileName = localFileName;

      clearError();

      try {
        if (!buildSpecElement) {
          showError("buildSpecElement function is not loaded. Check network or local scripts.");
          return;
        }

        // Save active spec in sessionStorage to keep parity with show.html
        sessionStorage.setItem("json_to_tag_active_spec", JSON.stringify(localSpec));
        sessionStorage.setItem("json_to_tag_active_name", localFileName);

        if (activeFileNameBadge) {
          activeFileNameBadge.innerHTML = `<i class="bi bi-file-earmark-check text-primary me-1"></i>${localFileName}`;
        }

        outputContainer.innerHTML = "";
        const rendered = buildSpecElement({ inSpec: localSpec });

        if (rendered) {
          if (Array.isArray(rendered)) {
            outputContainer.append(...rendered);
          } else if (rendered instanceof Node) {
            outputContainer.appendChild(rendered);
          }
        }

        const domCount = outputContainer.querySelectorAll("*").length;
        nodesCountBadge.textContent = `${domCount} DOM Nodes`;

        // Update status indicators
        if (syncDot) syncDot.className = "sync-indicator synced";
        if (syntaxStatusText) syntaxStatusText.textContent = "Live Rendered";
        if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-success-subtle text-success border border-success-subtle small px-2 py-1";

      } catch (err) {
        showError(err.message || String(err));
        if (syncDot) syncDot.className = "sync-indicator error";
        if (syntaxStatusText) syntaxStatusText.textContent = "Render Error";
        if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-danger-subtle text-danger border border-danger-subtle small px-2 py-1";
        console.error("DOM Rendering Error:", err);
      }
    };

    // Parse editor text and trigger render
    const parseAndRenderEditorContent = () => {
      const content = getEditorValue().trim();
      updateLineCountBadge(content);

      if (!content) {
        outputContainer.innerHTML = `
          <div class="empty-render-state" id="emptyPlaceholder">
            <i class="bi bi-cloud-arrow-up empty-render-icon"></i>
            <h5 class="fw-semibold text-secondary">No Output to Display</h5>
            <p class="small text-muted mb-0">Select or upload a JSON file to render the output here.</p>
          </div>
        `;
        nodesCountBadge.textContent = "0 DOM Nodes";
        nodesCountBadge.className = "badge bg-light text-secondary border fw-normal";
        if (activeFileNameBadge) activeFileNameBadge.innerHTML = `<i class="bi bi-file-earmark me-1"></i>No file loaded`;
        if (syncDot) {
          syncDot.className = "sync-indicator";
          syncDot.style.backgroundColor = "#94a3b8";
        }
        if (syntaxStatusText) syntaxStatusText.textContent = "Ready";
        if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-light text-secondary border small px-2 py-1";
        clearError();
        return;
      }

      try {
        const parsed = JSON.parse(content);
        clearError();
        renderSpec({ inSpec: parsed, inFileName: currentFileName });
      } catch (err) {
        if (syncDot) syncDot.className = "sync-indicator error";
        if (syntaxStatusText) syntaxStatusText.textContent = "Syntax Error";
        if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-danger-subtle text-danger border border-danger-subtle small px-2 py-1";
        showError("Invalid JSON syntax: " + err.message);
      }
    };

    // Debounced live change handler
    const onEditorChange = () => {
      if (!autoRenderToggle.checked) {
        if (syncDot) syncDot.className = "sync-indicator syncing";
        if (syntaxStatusText) syntaxStatusText.textContent = "Unrendered Changes";
        if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-warning-subtle text-warning-emphasis border border-warning-subtle small px-2 py-1";
        return;
      }

      if (syncDot) syncDot.className = "sync-indicator syncing";
      if (syntaxStatusText) syntaxStatusText.textContent = "Syncing...";
      if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-warning-subtle text-warning-emphasis border border-warning-subtle small px-2 py-1";

      clearTimeout(liveRenderDebounceTimer);
      liveRenderDebounceTimer = setTimeout(() => {
        parseAndRenderEditorContent();
      }, 250);
    };

    // Load spec content into editor and render
    const loadSpecIntoEditor = (specObj, fileName) => {
      const formatted = JSON.stringify(specObj, null, 2);
      currentFileName = fileName || "spec.json";
      setEditorValue(formatted);
      renderSpec({ inSpec: specObj, inFileName: currentFileName });
    };

    // Initialize Monaco Editor
    const initMonaco = () => {
      if (typeof window.require !== "undefined") {
        // Setup worker proxy for Monaco CDN cross-origin worker support
        window.MonacoEnvironment = {
          getWorkerUrl: function () {
            const proxy = `
              self.MonacoEnvironment = {
                baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'
              };
              importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');
            `;
            return `data:text/javascript;charset=utf-8,${encodeURIComponent(proxy)}`;
          }
        };

        window.require.config({
          paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" }
        });

        window.require(["vs/editor/editor.main"], function () {
          isMonacoLoaded = true;
          fallbackEditor.style.display = "none";
          monacoContainer.style.display = "block";

          monacoEditorInstance = monaco.editor.create(monacoContainer, {
            value: "",
            language: "json",
            theme: currentTheme,
            automaticLayout: true,
            fontSize: 13,
            lineNumbers: "on",
            minimap: { enabled: true, maxColumn: 45 },
            scrollBeyondLastLine: false,
            folding: true,
            formatOnPaste: true,
            formatOnType: true,
            tabSize: 2,
            wordWrap: "on",
            padding: { top: 12, bottom: 12 }
          });

          updateLineCountBadge("");

          // Monaco change event listener
          monacoEditorInstance.onDidChangeModelContent(() => {
            onEditorChange();
          });
        });
      } else {
        // Fallback if Monaco CDN script is unavailable
        fallbackEditor.style.display = "block";
        monacoContainer.style.display = "none";
        setEditorValue("");

        fallbackEditor.addEventListener("input", () => {
          onEditorChange();
        });
      }
    };

    // File Input change listener
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const rawText = event.target.result;
          const parsed = JSON.parse(rawText);
          loadSpecIntoEditor(parsed, file.name);
        } catch (err) {
          showError("Invalid JSON in uploaded file: " + err.message);
          // Still put raw text in editor so user can inspect and fix
          setEditorValue(event.target.result);
          currentFileName = file.name;
          if (activeFileNameBadge) activeFileNameBadge.innerHTML = `<i class="bi bi-file-earmark-x text-danger me-1"></i>${file.name}`;
          if (syncDot) syncDot.className = "sync-indicator error";
          if (syntaxStatusText) syntaxStatusText.textContent = "Syntax Error";
          if (syntaxStatusBadge) syntaxStatusBadge.className = "badge bg-danger-subtle text-danger border border-danger-subtle small px-2 py-1";
        }
      };
      reader.readAsText(file);
    });

    // Drag and Drop support
    ["dragenter", "dragover"].forEach(eventName => {
      editorPanel.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        editorPanel.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(eventName => {
      editorPanel.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        editorPanel.classList.remove("dragover");
      });
    });

    editorPanel.addEventListener("drop", (e) => {
      const file = e.dataTransfer?.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          loadSpecIntoEditor(parsed, file.name);
        } catch (err) {
          showError("Dropped file contains invalid JSON: " + err.message);
          setEditorValue(evt.target.result);
          currentFileName = file.name;
        }
      };
      reader.readAsText(file);
    });

    // Sample Buttons (if present)
    if (btnSampleTable) {
      btnSampleTable.addEventListener("click", () => {
        loadSpecIntoEditor(SAMPLE_TABLE_SPEC, "spec.json (Sample Table)");
      });
    }

    if (btnSampleSpec) {
      btnSampleSpec.addEventListener("click", () => {
        loadSpecIntoEditor(SAMPLE_CARD_SPEC, "sample-card.json");
      });
    }

    // Load from Session Storage (Tag Analysis connection)
    const checkSessionSpec = () => {
      try {
        const savedSpec = sessionStorage.getItem("json_to_tag_active_spec");
        const savedName = sessionStorage.getItem("json_to_tag_active_name") || "Analyzed Spec";
        if (savedSpec && btnLoadSession) {
          btnLoadSession.style.display = "inline-block";
          btnLoadSession.title = `Load "${savedName}" from Tag Analysis`;
        }
      } catch (e) {
        // Ignore session read errors
      }
    };

    if (btnLoadSession) {
      btnLoadSession.addEventListener("click", () => {
        try {
          const savedSpec = sessionStorage.getItem("json_to_tag_active_spec");
          const savedName = sessionStorage.getItem("json_to_tag_active_name") || "Analyzed Spec";
          if (savedSpec) {
            const parsed = JSON.parse(savedSpec);
            loadSpecIntoEditor(parsed, savedName);
          }
        } catch (err) {
          showError("Failed to load spec from session: " + err.message);
        }
      });
    }

    // Manual Render Button
    btnManualRender.addEventListener("click", () => {
      parseAndRenderEditorContent();
    });

    // Format / Prettify JSON Button
    btnFormatJson.addEventListener("click", () => {
      if (isMonacoLoaded && monacoEditorInstance) {
        monacoEditorInstance.getAction("editor.action.formatDocument").run();
      } else {
        try {
          const val = JSON.parse(fallbackEditor.value);
          fallbackEditor.value = JSON.stringify(val, null, 2);
        } catch (e) {
          showError("Cannot format invalid JSON: " + e.message);
        }
      }
    });

    // Copy JSON Button
    btnCopyJson.addEventListener("click", async () => {
      try {
        const code = getEditorValue();
        await navigator.clipboard.writeText(code);
        const originalHtml = btnCopyJson.innerHTML;
        btnCopyJson.innerHTML = `<i class="bi bi-check2 text-success me-1"></i> Copied!`;
        setTimeout(() => {
          btnCopyJson.innerHTML = originalHtml;
        }, 1800);
      } catch (err) {
        alert("Clipboard copy failed: " + err.message);
      }
    });

    // Theme Toggle (Light / Dark)
    btnToggleTheme.addEventListener("click", () => {
      if (currentTheme === "vs") {
        currentTheme = "vs-dark";
        themeIcon.className = "bi bi-sun-fill text-warning";
        if (isMonacoLoaded && monaco) {
          monaco.editor.setTheme("vs-dark");
        }
      } else {
        currentTheme = "vs";
        themeIcon.className = "bi bi-moon-stars";
        if (isMonacoLoaded && monaco) {
          monaco.editor.setTheme("vs");
        }
      }
    });

    // Clear Editor Button
    btnClearEditor.addEventListener("click", () => {
      if (confirm("Clear editor contents?")) {
        setEditorValue("");
        parseAndRenderEditorContent();
      }
    });

    // Clear Output Button
    btnClearOutput.addEventListener("click", () => {
      outputContainer.innerHTML = `
        <div class="empty-render-state">
          <i class="bi bi-display empty-render-icon"></i>
          <h5 class="fw-semibold text-secondary">Output Cleared</h5>
          <p class="small text-muted mb-0">Click <strong>Render</strong> or type in editor to restore.</p>
        </div>
      `;
      nodesCountBadge.textContent = "0 DOM Nodes";
    });

    // Close Error Alert Button
    btnCloseErrorAlert.addEventListener("click", () => {
      clearError();
    });

    // HTML Inspector Modal
    let bootstrapModalInstance = null;
    btnViewHtml.addEventListener("click", () => {
      const htmlContent = outputContainer.innerHTML;
      htmlModalCode.textContent = htmlContent.trim() || "<!-- Output container is empty -->";
      if (!bootstrapModalInstance && window.bootstrap) {
        bootstrapModalInstance = new bootstrap.Modal(document.getElementById("htmlModal"));
      }
      if (bootstrapModalInstance) {
        bootstrapModalInstance.show();
      }
    });

    btnCopyHtml.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(htmlModalCode.textContent);
        const orig = btnCopyHtml.innerHTML;
        btnCopyHtml.innerHTML = `<i class="bi bi-check2 text-success me-1"></i> Copied!`;
        setTimeout(() => {
          btnCopyHtml.innerHTML = orig;
        }, 1800);
      } catch (err) {
        alert("Copy HTML failed: " + err.message);
      }
    });

    // Start initialization
    initMonaco();
    checkSessionSpec();
  </script>
</body>

</html>
